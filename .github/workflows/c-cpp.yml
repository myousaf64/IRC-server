name: C++ IRC Server CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                compiler: [g++, clang++]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up C++ environment
              run: |
                  sudo apt-get update
                  sudo apt-get install -y make g++ clang

            - name: Build the project
              run: make CXX=${{ matrix.compiler }}

            - name: Run integration test suite
              run: make test CXX=${{ matrix.compiler }}

            - name: Upload test artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-logs-${{ matrix.compiler }}
                  path: |
                      **/server.log
                  if-no-files-found: ignore

    asan:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up clang
              run: |
                  sudo apt-get update
                  sudo apt-get install -y make clang

            - name: Build with sanitizers
              run: make asan CXX=clang++

            - name: Run integration test suite under ASan/UBSan
              run: make test-asan CXX=clang++

            - name: Upload test artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-logs-asan
                  path: |
                      **/server.log
                  if-no-files-found: ignore

    cppcheck:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install cppcheck
              run: |
                  sudo apt-get update
                  sudo apt-get install -y cppcheck

            - name: Run cppcheck
              run: make cppcheck
